<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Ascent — Miles Tracker</title>

    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Ascent">
    <meta name="theme-color" content="#f3f1ea">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">

    <script>
      // Resolve theme before first paint to avoid a flash. Mirrors applyTheme() in script.js.
      (function () {
        try {
          var pref = localStorage.getItem("ascentTheme"); // "light" | "dark" | null (system)
          var dark = pref ? pref === "dark"
                          : window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches;
          document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
          var m = document.querySelector('meta[name="theme-color"]');
          if (m) m.content = dark ? "#0d1517" : "#f3f1ea";
        } catch (e) { /* default to light */ }
      })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">

        <header class="app-header">
            <div class="brand">
                <svg class="brand-mark" width="27" height="20" viewBox="0 0 32 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                    <path d="M2 19L11 12L17 16L29 4"/>
                    <circle cx="29" cy="4" r="3" fill="currentColor" stroke="none"/>
                </svg>
                <span class="brand-name">Ascent</span>
            </div>
            <div class="header-actions">
            <button id="themeToggle" class="icon-btn" type="button" aria-label="Theme">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                    <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.6"/>
                    <path d="M12 3a9 9 0 0 0 0 18Z" fill="currentColor"/>
                </svg>
            </button>
            <button id="settingsButton" class="icon-btn" aria-label="Card settings" title="Card settings">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                    <path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z" stroke="currentColor" stroke-width="1.6"/>
                    <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h.01a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51h.01a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v.01a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </button>
            </div>
        </header>

        <!-- Add Purchase -->
        <section class="card">
            <h2>Add Purchase</h2>
            <div class="input-group">
                <input type="text" id="purchaseAmount" class="input-full" placeholder="Enter amount" inputmode="decimal" pattern="[0-9]*" autocomplete="off" autocorrect="off" spellcheck="false">
                <button id="addButton" class="btn-primary" aria-label="Add purchase">
                    <svg class="add-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                        <path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                    <span>Add</span>
                </button>
            </div>
            <div id="purchaseTypeGroup" class="toggle-group">
                <!-- Category toggles rendered from card config -->
            </div>
            <div id="inlineRecommendation" class="recommendation-card" aria-live="polite" hidden></div>
            <div class="card-field">
                <label for="cardSelector">Card</label>
                <select id="cardSelector" class="select-theme"></select>
            </div>
        </section>

        <!-- Summary -->
        <section class="card">
            <div class="card-header-row">
                <h2>Summary</h2>
                <button id="exportButton" class="btn-secondary" aria-label="Export monthly spend as CSV">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                        <path d="M12 3v12m0 0 4-4m-4 4-4-4M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                    <span>Export CSV</span>
                </button>
            </div>
            <div class="total-miles-display">
                <p>Total Miles Earned</p>
                <h3 id="totalMiles">0</h3>
            </div>
            <div id="progressBarsContainer"></div>
        </section>

        <!-- Transaction History -->
        <section class="card">
            <h2>Transaction History</h2>
            <div id="transactionTable" class="tx-table">
                <div class="tx-header">
                    <span class="tx-h">Date</span>
                    <span class="tx-h">Type</span>
                    <span class="tx-h num">$</span>
                    <span class="tx-h num">Miles</span>
                </div>
                <div id="transactionList">
                    <!-- JS will fill this dynamically -->
                </div>
            </div>
        </section>

        <footer class="footer-note">
            <p>Ascent v4.0.0 — Last updated: 10 Jul 2026</p>
            <button id="resetButton" class="reset-text" aria-label="Reset tracker">Reset all data</button>
        </footer>

    </div> <!-- end of container -->

    <!-- Card Settings (native dialog) -->
    <dialog id="settingsPanel" class="settings-dialog">
        <div class="settings-dialog-inner">
            <div class="card-header-row">
                <h2>Card Settings</h2>
                <button id="settingsCloseButton" class="icon-btn" aria-label="Close settings">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                        <path d="M6 6l12 12M18 6 6 18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
                    </svg>
                </button>
            </div>
            <p class="settings-hint">Caps are monthly SGD spend per pool. Rules with several categories share one pool.</p>
            <div id="settingsCards"></div>
            <label class="settings-toggle">
                <input type="checkbox" id="overflowSplitToggle">
                <span>Overflow split: when a purchase exceeds the best card's remaining cap, recommend splitting it across cards</span>
            </label>
            <p id="settingsError" class="settings-error" role="alert" hidden></p>
            <div class="settings-actions">
                <button id="settingsAddCardButton" class="btn-secondary" type="button">+ Add Card</button>
                <button id="settingsSaveButton" class="btn-primary" type="button">Save</button>
            </div>
        </div>
    </dialog>

    <div id="undoToast" class="undo-toast">
        <span>Transaction removed</span>
        <button class="undo-btn">Undo</button>
    </div>
    <div id="addToast" aria-live="polite"><span></span></div>

    <script src="script.js"></script>

    <!-- Vercel Web Analytics — static-site snippet (no npm/React needed).
         Loads only when deployed on Vercel with Web Analytics enabled;
         the script path 404s locally, which is expected and harmless. -->
    <script>
      window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
    </script>
    <script defer src="/_vercel/insights/script.js"></script>
</body>
</html>
